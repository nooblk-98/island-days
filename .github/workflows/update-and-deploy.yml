name: Update holidays and deploy

on:
  push:
    branches: [main]
  schedule:
    # 05:47 Asia/Colombo on the first day of every month.
    - cron: '17 0 1 * *'
  workflow_dispatch:

concurrency:
  group: island-days-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment settings
        id: settings
        shell: bash
        run: |
          ready=true
          for setting in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [ -z "${!setting}" ]; then
              echo "::notice::Cloudflare setup is waiting for $setting. See DEPLOYMENT.md."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo '### Cloudflare setup pending' >> "$GITHUB_STEP_SUMMARY"
            echo 'Calendar checks still run. Add the Cloudflare secrets and project variable described in DEPLOYMENT.md, then run this workflow again to enable monthly updates and publishing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci --no-audit --no-fund
      # Every run re-checks the Central Bank list so the site's "Last checked" date stays fresh.
      # On a code push a source outage must not block the deploy, so the saved data is used instead.
      - name: Fetch and validate Central Bank holiday lists
        if: steps.settings.outputs.ready == 'true'
        continue-on-error: ${{ github.event_name == 'push' }}
        run: npm run refresh
      - run: npm test
      - run: npm run build
      # Commit only when a holiday actually changed, not just the check timestamp.
      - name: Save changed holiday data
        if: steps.settings.outputs.ready == 'true'
        shell: bash
        run: |
          if [ "$(node scripts/data-changed.mjs)" = true ]; then
            git config user.name 'Lahiru S Liyanage'
            git config user.email '125950957+nooblk-98@users.noreply.github.com'
            git add public/data/holidays.json
            git commit -m 'Update Sri Lanka holiday data [skip ci]'
            git push origin HEAD:main
          else
            echo 'Holiday data unchanged; nothing to commit.'
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.settings.outputs.ready == 'true'
        run: npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main --commit-dirty=true

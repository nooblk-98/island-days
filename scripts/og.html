<!doctype html>
<!-- Source for public/og.png (1200x630 link preview). Regenerate with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f8f8f2; color: #253c30; font-family: 'Segoe UI', Inter, Arial, sans-serif; display: flex; align-items: center; padding: 0 70px; box-sizing: border-box; gap: 60px; position: relative; }
  body::before { content: ''; position: absolute; right: -140px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: #eef0e4; }
  .copy, .card { position: relative; }
  .copy { flex: 1; }
  .brand { font-size: 30px; font-weight: 700; letter-spacing: -.5px; display: flex; align-items: center; gap: 12px; }
  .brand b { font-weight: 400; } .brand i { color: #b7953f; font-style: normal; }
  .brand svg { width: 34px; height: 34px; stroke: #284f3c; stroke-width: 3; stroke-linecap: round; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 76px; line-height: 1.02; letter-spacing: -2px; margin: 46px 0 26px; }
  h1 em { color: #71806a; }
  p { font-size: 25px; line-height: 1.45; color: #6c7564; margin: 0 0 34px; max-width: 520px; }
  .url { display: inline-flex; align-items: center; gap: 10px; background: #284f3c; color: #f7f6e9; font-size: 21px; padding: 13px 22px; border-radius: 40px; }
  .card { width: 430px; background: #fffefa; border: 1px solid #e5e7dd; border-radius: 26px; padding: 30px 28px 26px; box-shadow: 0 20px 50px #213d2914; }
  .card h2 { margin: 0 0 18px; font-size: 22px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { font-size: 14px; font-weight: 500; color: #8a8f84; letter-spacing: 1px; }
  .week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .week span { font-size: 13px; letter-spacing: 1px; color: #8a8f84; margin-bottom: 12px; }
  .week span:nth-child(n+6) { color: #46596a; }
  .grid { row-gap: 9px; }
  .grid span { position: relative; display: flex; justify-content: center; }
  .grid i { position: relative; z-index: 1; width: 46px; height: 46px; border-radius: 50%; background: #ebeae4; color: #5d625a; font-style: normal; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .grid .w i { background: #dfe6ec; color: #46596a; }
  .grid .pub i { background: #cfe0c4; color: #24432f; font-weight: 700; }
  .grid .poya i { background: #f3dc9a; color: #5f4511; font-weight: 700; }
  .grid .today i { background: #f2995a; color: #2b1a0d; font-weight: 700; }
  .grid .lw::before { content: ''; position: absolute; top: -4px; bottom: -4px; left: -2px; right: -2px; background: #f8e6cf; }
  .grid .s::before { left: 3px; border-radius: 30px 0 0 30px; } .grid .e::before { right: 3px; border-radius: 0 30px 30px 0; }
  .legend { display: flex; gap: 16px; margin-top: 20px; font-size: 13px; color: #6c7564; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 40 40"><path d="M20 3v34M3 20h34M8 8l24 24M8 32 32 8"/></svg><span>island<b>days</b><i>.</i></span></div>
    <h1>A little more<br>time for <em>life.</em></h1>
    <p>Sri Lanka public holidays, Poya days, long weekends and smart leave ideas.</p>
    <span class="url">dayoff.itsnooblk.com ↗</span>
  </div>
  <div class="card">
    <h2>April <span>LONG WEEKENDS</span></h2>
    <div class="week"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="grid">
      <span></span><span></span><span class="poya"><i>1</i></span><span><i>2</i></span><span class="pub lw s"><i>3</i></span><span class="w lw"><i>4</i></span><span class="w lw e"><i>5</i></span>
      <span><i>6</i></span><span><i>7</i></span><span><i>8</i></span><span><i>9</i></span><span class="today"><i>10</i></span><span class="w lw s"><i>11</i></span><span class="w lw e"><i>12</i></span>
      <span class="pub lw s"><i>13</i></span><span class="pub lw e"><i>14</i></span><span><i>15</i></span><span><i>16</i></span><span><i>17</i></span><span class="w"><i>18</i></span><span class="w"><i>19</i></span>
    </div>
    <div class="legend"><span><b style="background:#e2c06c"></b>Poya</span><span><b style="background:#8fb27c"></b>Holiday</span><span><b style="background:#efc994"></b>Long weekend</span></div>
  </div>
</body>
</html>
